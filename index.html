<style>

.av{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-size:12px;font-weight:700}
.nm{flex:1}.tk{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--pri2);color:#fff;font-size:14px;transform:scale(0);opacity:0;animation:var(--t) 10s infinite}
.plus{position:absolute;bottom:-17px;right:10px;background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff;font-weight:800;font-size:15px;padding:7px 13px;border-radius:20px;box-shadow:0 8px 18px color-mix(in srgb,var(--pri2) 40%,transparent);transform:scale(0);opacity:0;animation:badge 10s infinite}
.tips{position:relative;height:58px;width:100%;margin-top:26px}.tips p{position:absolute;inset:0;margin:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;line-height:1.35;opacity:0;animation:tip 9s infinite}
.tips b{color:var(--ok)}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes ring{0%,88%,100%{transform:rotate(0)}91%{transform:rotate(-14deg)}94%{transform:rotate(12deg)}97%{transform:rotate(-8deg)}}
@keyframes t1{0%,6%{transform:scale(0);opacity:0}10%{transform:scale(1.35);opacity:1}13%,88%{transform:scale(1);opacity:1}94%,100%{transform:scale(0);opacity:0}}
@keyframes t2{0%,16%{transform:scale(0);opacity:0}20%{transform:scale(1.35);opacity:1}23%,88%{transform:scale(1);opacity:1}94%,100%{transform:scale(0);opacity:0}}
@keyframes t3{0%,26%{transform:scale(0);opacity:0}30%{transform:scale(1.35);opacity:1}33%,88%{transform:scale(1);opacity:1}94%,100%{transform:scale(0);opacity:0}}
@keyframes t4{0%,36%{transform:scale(0);opacity:0}40%{transform:scale(1.35);opacity:1}43%,88%{transform:scale(1);opacity:1}94%,100%{transform:scale(0);opacity:0}}
@keyframes badge{0%,46%{transform:scale(0) rotate(-25deg);opacity:0}52%{transform:scale(1.25) rotate(10deg);opacity:1}56%{transform:scale(1) rotate(-5deg)}60%,88%{transform:scale(1) rotate(0);opacity:1}94%,100%{transform:scale(0) rotate(15deg);opacity:0}}
@keyframes tip{0%{opacity:0;transform:translateY(12px)}5%,28%{opacity:1;transform:none}33%,100%{opacity:0;transform:translateY(-12px)}}
@keyframes rise{to{opacity:1;transform:none}}@keyframes pop{from{transform:scale(0) rotate(-30deg);opacity:0}}@keyframes type{to{width:26ch}}@keyframes caret{50%{border-color:transparent}}@keyframes bg{50%{background-position:100% 100%}}
@keyframes fade{from{opacity:0;transform:translateY(18px)}}@keyframes float{50%{transform:translateY(-10px)}}@keyframes drift{to{transform:translate(30px,20px) scale(1.15)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}@keyframes flipin{from{opacity:0;transform:translateY(-12px) scale(.9)}}@keyframes pulse{50%{opacity:.25}}
.dot{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:36px;height:36px;display:grid;place-items:center;cursor:pointer;z-index:5;opacity:.45;transition:opacity .2s}
.dot::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--mut)}.dot:hover,.dot:focus-visible{opacity:1;outline:0}
.hint{font-size:13px;color:var(--mut)}
#err{margin:0 0 12px;padding:11px 13px;border:1px solid var(--er);border-radius:12px;color:var(--er);background:var(--card);font-size:14px;font-weight:600;word-break:break-word}#err[hidden]{display:none}
@media (min-width:900px){
 main{max-width:1100px;padding:4vh 32px 48px}
 .brand{margin-bottom:22px;font-size:18px}
 #app.s-class,#app.s-auth,#app.s-home,#app.s-mark,#app.s-rep,#app.s-adminin{max-width:500px;margin:4vh auto 0}
 #app.s-repHome,#app.s-admin{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:20px;align-items:start}
 #app.s-repHome>.msg,#app.s-admin>.msg,#app.s-repHome>button,#app.s-admin>button{grid-column:1/-1}
 #app.s-repHome>button,#app.s-admin>button{justify-self:start;width:auto;padding:13px 30px}
 .hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-areas:"kick reg" "big reg" "tips reg" "later reg";column-gap:56px;align-content:center;justify-items:start;text-align:left;min-height:min(80vh,640px);padding:44px 60px}
 .hero .kick{grid-area:kick}.hero .big{grid-area:big;font-size:50px;margin:18px 0 6px}
 .hero .reg{grid-area:reg;align-self:center;justify-self:center;max-width:400px;margin:0}

 .hero>.fl{display:none}
 #app>.wide{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){body::before,.hero,.hero::before,.hero::after,.hero .cap,.pill.on::before,.tk,.plus,.tips p,.clk,.clk::before,.clk::after,.hero>.fl{animation-iteration-count:1!important}.tips p:first-child{opacity:1}}

<script>
const CFG={url:'https://veovcuveahclbkvtfzwc.supabase.co',key:'sb_publishable_gNffGLiAKkiv_bUSbAFsrg_ZKrf3lvw'};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const live=!!(CFG.url&&CFG.key&&window.supabase);
const sb=live?supabase.createClient(CFG.url,CFG.key):null;
const showErr=t=>{const e=$('#err');if(e){e.textContent=t;e.hidden=false}};
addEventListener('error',e=>showErr('Page error: '+e.message));
addEventListener('unhandledrejection',e=>showErr('Error: '+((e.reason&&e.reason.message)||e.reason)));
const PROG=['Regular','Top-up','Access'],INTK=['September','January'],LV=[100,200,300,400];
const BATCH=Array.from({length:13},(_,i)=>2023+i);
const CL0='Regular|September|2023|100';
let D={roster:[{cls:CL0,sid:'S001',name:'Ama Mensah'},{cls:CL0,sid:'S002',name:'Kojo Boateng'}],users:[{id:'r1',email:'rep@demo.com',pw:'rep123',role:'rep',name:'Demo Rep',cls:CL0},{id:'a1',email:'admin@demo.com',pw:'admin123',role:'admin',name:'Demo Admin',cls:'ADMIN'}],courses:[{id:'c1',cls:CL0,name:'Basic Nursing'},{id:'c2',cls:CL0,name:'Medicine'}],sess:[],att:[],cred:{},exp:{}};
let editRt=false,curWeek=1,me=null,scr='welcome',msg='',st={},sel={program:'Regular',intake:'September',batch:2023,level:100};
const ck=c=>[c.program,c.intake,c.batch,c.level].join('|');
const mail=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'-')+'@students.example.com';
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const unb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const mkcode=()=>String(100000+crypto.getRandomValues(new Uint32Array(1))[0]%900000);
const dcode=(s,k)=>String(100000+Math.abs([...s+':'+k].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7))%900000);
const prof=async id=>{const r=await sb.from('profiles').select('*').eq('id',id).maybeSingle();if(r.error)throw Error(r.error.message);if(!r.data){await sb.auth.signOut();throw Error('Signed in, but this account has no profile yet. Admin: run the admin profile SQL (fix-admin.sql) in Supabase. Students: ask your course rep.')}const p=r.data;return{id:p.id,name:p.full_name,role:p.role,cls:p.class_key,sid:p.student_id}};

const api={
 async lookup(cls,sid){
  if(!live){const r=D.roster.find(r=>r.cls===cls&&r.sid===sid);return r?{name:r.name,claimed:!!r.uid}:null}
  const r=await sb.rpc('lookup_student',{p_class:cls,p_sid:sid});if(r.error)throw r.error;const x=r.data&&r.data[0];return x?{name:x.full_name,claimed:x.claimed}:null},
 async signUp(cls,sid,pw){
  if(!live){const r=D.roster.find(r=>r.cls===cls&&r.sid===sid);if(!r)throw Error('Not on roster');if(r.uid)throw Error('Account exists. Please sign in.');const u={id:'u'+sid,sid,name:r.name,pw,cls,role:'student'};D.users.push(u);r.uid=u.id;return u}
  const t=await sb.rpc('begin_signup',{p_class:cls,p_sid:sid});if(t.error)throw Error(t.error.message);const x=t.data&&t.data[0];if(!x)throw Error('Sign-up is not available for this ID');
  const {data,error}=await sb.auth.signUp({email:x.login_email,password:pw,options:{data:{ticket:x.claim_ticket}}});
  if(error)throw Error(/database error|not allowed/i.test(error.message)?'Sign-up is not allowed for this ID. Please check with your course rep.':error.message);
  if(!data.session)throw Error('Account created. Turn off "Confirm email" in Supabase Auth settings, then sign in.');
  return prof(data.user.id)},
 async signIn(id,pw,rep,cls){
  if(!live){const u=D.users.find(u=>(rep?u.email===id&&u.role!=='student':u.sid===id)&&u.pw===pw);if(!u)throw Error('Wrong details');return u}
  let email;if(rep)email=id.toLowerCase();else{const r=await sb.rpc('student_login_email',{p_class:cls,p_sid:id});if(r.error)throw Error(r.error.message);email=r.data;if(!email)throw Error('Wrong details')}
  const {data,error}=await sb.auth.signInWithPassword({email,password:pw});if(error)throw Error(/not confirmed/i.test(error.message)?'This account is not confirmed yet. Ask the admin to confirm it (see fix-rep.sql).':'Wrong details');return prof(data.user.id)},
 async courses(){
  if(!live)return D.courses.filter(c=>c.cls===me.cls).map(c=>({id:c.id,name:c.name,open:!!D.sess.find(s=>s.course===c.id&&s.closes>Date.now())}));
  const r=await sb.rpc('class_courses');if(r.error)throw r.error;return r.data.map(c=>({id:c.id,name:c.name,open:c.is_open}))},
 async addCourses(names){
  if(!live){names.forEach(n=>{if(!D.courses.find(c=>c.cls===me.cls&&c.name===n))D.courses.push({id:'c'+Date.now()+Math.random(),cls:me.cls,name:n})});return}
  const r=await sb.from('courses').upsert(names.map(n=>({class_key:me.cls,name:n})),{onConflict:'class_key,name',ignoreDuplicates:true});if(r.error)throw Error(r.error.message)},
 async rosterCount(){
  if(!live)return D.roster.filter(r=>r.cls===me.cls).length;
  const r=await sb.from('roster').select('*',{count:'exact',head:true}).eq('class_key',me.cls);return r.count||0},
 async upload(rows){
  if(!live){rows.forEach(x=>{const r=D.roster.find(r=>r.cls===me.cls&&r.sid===x.sid);r?r.name=x.name:D.roster.push({cls:me.cls,sid:x.sid,name:x.name})});return}
  for(let i=0;i<rows.length;i+=500){const r=await sb.from('roster').upsert(rows.slice(i,i+500).map(x=>({class_key:me.cls,student_id:x.sid,full_name:x.name})),{onConflict:'class_key,student_id'});if(r.error)throw Error(r.error.message)}},
 async active(cid){
  if(!live){const s=D.sess.find(s=>s.course===cid&&s.closes>Date.now());return s||null}
  const r=await sb.from('sessions').select('id,closes_at,week').eq('course_id',cid).gt('closes_at',new Date().toISOString()).limit(1);
  const s=r.data&&r.data[0];return s?{id:s.id,week:s.week,closes:Date.parse(s.closes_at)}:null},
 async close(cid){
  if(!live){D.sess.forEach(s=>{if(s.course===cid)s.closes=0});return}
  await sb.from('sessions').update({closes_at:new Date().toISOString()}).eq('course_id',cid).gt('closes_at',new Date().toISOString())},
 async open(cid,week){
  if(!live){if(D.sess.find(s=>s.course===cid&&s.closes>Date.now()))throw Error('A code is already open. Close it first, or wait for it to clear.');const closes=Date.now()+4e4,secret=mkcode()+Math.random(),o=D.sess.find(s=>s.course===cid&&s.week===week);if(o){o.closes=closes;o.secret=secret}else D.sess.push({id:'s'+Date.now(),course:cid,cls:me.cls,week,secret,closes});return}

async function enroll(){
 const id=await api.getCred();if(id)return id;
 const c=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:'Register Platform'},user:{id:new TextEncoder().encode(me.id),name:me.sid,displayName:me.name},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});
 const cid=b64(c.rawId);await api.saveCred(cid,b64(c.response.getPublicKey?c.response.getPublicKey():new ArrayBuffer(0)));return cid}
async function verify(cid){await navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:'public-key',id:unb(cid),transports:['internal']}],userVerification:'required',timeout:60000}})}
function parseRoster(t){const out=[],seen={};t.split(/\r?\n/).forEach((l,i)=>{const p=l.split(/[,\t;]/).map(x=>x.trim().replace(/^"|"$/g,''));const sid=p[0],name=p.slice(1).join(' ').replace(/[\u0000-\u001f]/g,'').replace(/\s+/g,' ').trim().slice(0,100);if(!/^[A-Za-z0-9._-]{1,20}$/.test(sid)||!name||out.length>=3000)return;if(i===0&&/id/i.test(sid)&&/name/i.test(name))return;if(!seen[sid]){seen[sid]=1;out.push({sid,name})}});return out}
const rowsToLines=rows=>{let ic=0,nc=[1],st0=0;const h=(rows[0]||[]).map(x=>String(x).toLowerCase()),hi0=h.findIndex(x=>/\b(id|index|matric|reg)\b|number/.test(x)),hi=hi0>=0?hi0:h.findIndex(x=>/^(no\.?|s\/n)$/.test(x)),hn=h.map((x,i)=>/name/.test(x)?i:-1).filter(i=>i>=0);
 if(hi>=0&&hn.length){ic=hi;nc=hn.slice(0,3);st0=1}return rows.slice(st0).map(r=>[r[ic],...nc.map(i=>r[i])].join('\t')).join('\n')};
const fileToText=async f=>{if(f.size>1e6)throw Error('File is too big. Use a file under 1 MB with just ID and name columns.');
 if(/\.(xlsx|xls)$/i.test(f.name)){if(!window.XLSX)throw Error('Excel library did not load. Check your internet connection.');
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array',sheetRows:3002}),ws=wb.Sheets[wb.SheetNames[0]];if(!ws)throw Error('The Excel file is empty');
  return rowsToLines(XLSX.utils.sheet_to_json(ws,{header:1,raw:false,blankrows:false,defval:''}))}
 return f.text()};

$('#adm').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.target.click()}});
$('#mode').textContent=live?'':'Demo mode: data is kept in memory only. Demo ID: S001 (Regular, September, 2023, 100).';
setInterval(()=>document.querySelectorAll('[data-live]').forEach(async el=>{
 if(el.dataset.done)return;
 const finish=async why=>{el.dataset.done=1;el.textContent='······';let n='';try{n=' '+(await api.list({id:el.dataset.sid})).length+' student(s) marked for week '+el.dataset.wk+'.'}catch(e){}note((why||'The code has cleared.')+n+' To get a new code, open the course again.');render()};
 if(!+el.dataset.exp){if(el.dataset.busy)return;el.dataset.busy=1;
  try{const c=await api.liveCode(el.dataset.live);el.textContent=c.code;el.classList.add('flip');el.dataset.exp=Date.now()+c.left*1e3}catch(e){return finish('This code has already expired.')}
  el.dataset.busy=''}
 const left=+el.dataset.exp-Date.now();
 if(left<=0)return finish('The 40-second code has cleared.');
 el.style.setProperty('--p',Math.max(0,Math.min(1,left/4e4)));const cd=el.nextElementSibling;if(cd)cd.textContent='Code clears in '+Math.ceil(left/1e3)+'s'}),1000);
if(CFG.url&&CFG.key&&!window.supabase)showErr('Could not load the Supabase library, so the site is running in demo mode. Check the internet connection, or whether something is blocking cdn.jsdelivr.net.');
else if(live)sb.rpc('lookup_student',{p_class:'x',p_sid:'x'}).then(r=>{if(r.error)showErr('Cannot reach the database: '+r.error.message+'. If this mentions permission or not found, run schema-update.sql again.')},e=>showErr('Cannot reach the database: '+e.message));
render();
</script></body></html>
