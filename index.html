  const r=await sb.from('roster').select('*',{count:'exact',head:true}).eq('class_key',me.cls);return r.count||0},
 async replaceRoster(rows,commit){
  if(!live){const cur=D.roster.filter(r=>r.cls===me.cls),nk=new Set(rows.map(x=>alnum(x.sid))),ok0=new Set(cur.map(r=>alnum(r.sid))),gone=cur.filter(r=>!nk.has(alnum(r.sid)));
   const res={added:rows.filter(x=>!ok0.has(alnum(x.sid))).length,kept:rows.filter(x=>ok0.has(alnum(x.sid))).length,removed:gone.length};
   if(commit){D.att=D.att.filter(a=>!gone.some(g=>g.sid===a.sid));
    D.roster=D.roster.filter(r=>r.cls!==me.cls||nk.has(alnum(r.sid)));rows.forEach(x=>{const r=D.roster.find(r=>r.cls===me.cls&&alnum(r.sid)===alnum(x.sid));r?r.name=x.name:D.roster.push({cls:me.cls,sid:x.sid,name:x.name})})}
   return res}
  const r=await sb.rpc('replace_roster',{p_rows:rows.map(x=>({sid:x.sid,name:x.name})),p_commit:commit});if(r.error)throw Error(r.error.message);return r.data[0]},
 async active(cid){
  if(!live){const s=D.sess.find(s=>s.course===cid&&s.closes>Date.now());return s||null}
  const r=await sb.from('sessions').select('id,closes_at,week').eq('course_id',cid).gt('closes_at',new Date().toISOString()).limit(1);
  const s=r.data&&r.data[0];return s?{id:s.id,week:s.week,closes:Date.parse(s.closes_at)}:null},
 async close(cid){
  if(!live){D.sess.forEach(s=>{if(s.course===cid)s.closes=0});return}
  await sb.from('sessions').update({closes_at:new Date().toISOString()}).eq('course_id',cid).gt('closes_at',new Date().toISOString())},
 async open(cid,week,pos){
  needAcc(pos);
  if(!live){if(D.sess.find(s=>s.course===cid&&s.closes>Date.now()))throw Error('A code is already open. Close it first, or wait for it to clear.');const closes=Date.now()+5e4,secret=mkcode()+Math.random(),o=D.sess.find(s=>s.course===cid&&s.week===week);if(o){Object.assign(o,{closes,secret,lat:pos.lat,lng:pos.lng})}else D.sess.push({id:'s'+Date.now(),course:cid,cls:me.cls,week,secret,closes,lat:pos.lat,lng:pos.lng});return}
  const r=await sb.rpc('open_session',{p_course:cid,p_week:week,p_lat:pos.lat,p_lng:pos.lng,p_acc:pos.acc});if(r.error)throw Error(r.error.message)},
 async sheet(cid){
  if(!live){const ss=D.sess.filter(s=>s.course===cid),rows=D.roster.filter(r=>r.cls===me.cls).map(r=>({sid:r.sid,name:r.name,weeks:ss.filter(s=>D.att.find(a=>a.s===s.id&&a.sid===r.sid)).map(s=>s.week)}));return{weeks:[...new Set(ss.map(s=>s.week))].sort((a,b)=>a-b),rows}}
  const w=await sb.from('sessions').select('week').eq('course_id',cid);let rows=[];
  for(let i=0;;i+=1000){const r=await sb.rpc('course_matrix',{p_course:cid}).range(i,i+999);if(r.error)throw Error(r.error.message);rows=rows.concat(r.data.map(x=>({sid:x.student_id,name:x.full_name,weeks:x.weeks||[]})));if(r.data.length<1000)break}
  return{weeks:[...new Set((w.data||[]).map(x=>x.week))].sort((a,b)=>a-b),rows}},
 async mark(cls,sid,code,pos){
  needAcc(pos);
  if(!live){const r=D.roster.find(r=>r.cls===cls&&alnum(r.sid)===alnum(sid));if(!r)throw Error('ID not found');
   const s=D.sess.find(s=>s.cls===cls&&s.closes>Date.now()&&dcode(s.secret,0)===code);if(!s)throw Error('Wrong or expired code');
   const d=Math.round(dist(pos,s));if(d>50)throw Error('You are about '+d+' m from the class. You must be within 50 m to mark attendance.');
   const out={name:r.name,course:D.courses.find(c=>c.id===s.course).name,week:s.week};
   if(D.att.find(a=>a.s===s.id&&a.sid===r.sid))return out;
   if(D.att.find(a=>a.s===s.id&&a.dev===dev()))throw Error('This phone has already been used to mark attendance for another student.');
   D.att.push({s:s.id,sid:r.sid,t:Date.now(),dev:dev()});return out}
  const r=await sb.rpc('mark_attendance',{p_class:cls,p_sid:sid,p_code:code,p_lat:pos.lat,p_lng:pos.lng,p_acc:pos.acc,p_device:dev()});if(r.error)throw Error(r.error.message);
  const x=r.data;if(!x||!x.ok)throw Error((x&&x.msg)||'Could not mark attendance');return x},
 async list(s){
  if(!live)return D.att.filter(a=>a.s===s.id).map(a=>{const r=D.roster.find(r=>r.sid===a.sid);return{name:r?r.name:a.sid,sid:a.sid,t:a.t}});
  const r=await sb.rpc('session_marks',{p_session:s.id});if(r.error)throw Error(r.error.message);
  return (r.data||[]).map(a=>({name:a.name||a.sid,sid:a.sid,t:Date.parse(a.t)}))},
 async liveCode(cid){
  if(!live){const s=D.sess.find(s=>s.course===cid&&s.closes>Date.now());if(!s)throw Error('No open session');return{code:dcode(s.secret,0),left:Math.ceil((s.closes-Date.now())/1e3)}}
  const r=await sb.rpc('session_code',{p_course:cid});if(r.error)throw r.error;return{code:r.data[0].code,left:r.data[0].secs}},
 async exported(cid){if(!live){D.exp[cid]=1;return}const r=await sb.rpc('mark_exported',{p_course:cid});if(r.error)throw Error(r.error.message)},
 async clear(cid){
  if(!live){if(!D.exp[cid])throw Error('Download the Excel register first');D.sess=D.sess.filter(s=>s.course!==cid);return}
  const r=await sb.rpc('clear_course',{p_course:cid});if(r.error)throw Error(r.error.message)},
 async createRep(name,email,pw,cls){
  if(!live){if(D.users.find(u=>u.email===email))throw Error('That email is already used');D.users.push({id:'r'+Date.now(),email,pw,role:'rep',name,cls});return}
  const token=b64(rnd(24)).replace(/[+/=]/g,'x');
  const inv=await sb.rpc('admin_invite_rep',{p_email:email,p_name:name,p_class:cls,p_token:token});if(inv.error)throw Error(inv.error.message);
  const tmp=supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'tmp-rep'}});
  const {data,error}=await tmp.auth.signUp({email,password:pw,options:{data:{invite:token}}});
  if(error)throw Error(/database error/i.test(error.message)?'The account could not be created. Please try again.':error.message);
  if(!data.user)throw Error('Could not create the account');
  if(!data.session)throw Error('Account created but NOT confirmed, so the rep cannot sign in yet. In Supabase turn off "Confirm email" (Authentication > Sign In / Providers > Email), then run fix-rep.sql.')},
 async changePw(pw){
  if(!live){const u=D.users.find(u=>u.id===me.id);if(u)u.pw=pw;return}
  const r=await sb.auth.updateUser({password:pw});if(r.error)throw Error(r.error.message)},
 async listReps(){
  if(!live)return D.users.filter(u=>u.role==='rep').map(u=>({id:u.id,name:u.name,email:u.email,cls:u.cls}));
  const r=await sb.rpc('admin_list_reps');if(r.error)throw Error(r.error.message);return r.data.map(x=>({id:x.id,name:x.full_name,email:x.email,cls:x.class_key}))},
 async delRep(id){
  if(!live){D.users=D.users.filter(u=>u.id!==id);return}
  const r=await sb.rpc('admin_delete_rep',{p_user:id});if(r.error)throw Error(r.error.message)},
 async stats(){if(!live)return{mb:0,rows:D.att.length};const r=await sb.rpc('admin_stats');if(r.error)throw Error(r.error.message);return r.data},
 async wipe(){if(!live){D.sess=[];D.att=[];return}const r=await sb.rpc('admin_clear_all');if(r.error)throw Error(r.error.message)}
};

const normId=x=>String(x==null?'':x).replace(/\s+/g,'').toUpperCase(),alnum=x=>normId(x).replace(/[^A-Z0-9]/g,'');
function parseRoster(t){const out=[],seen={},skipped=[];t.split(/\r?\n/).forEach((l,i)=>{if(!l.trim())return;const p=l.split(/[,\t;]/).map(x=>x.trim().replace(/^"|"$/g,''));const sid=normId(p[0]),name=p.slice(1).join(' ').replace(/[\u0000-\u001f]/g,'').replace(/\s+/g,' ').trim().slice(0,100);
 if(i===0&&/id/i.test(p[0])&&/name/i.test(name))return;
 if(!/^[A-Za-z0-9._\/-]{1,30}$/.test(sid)){skipped.push('"'+String(p[0]).slice(0,25)+'" is not a valid ID');return}
 if(!name){skipped.push(sid+' has no name');return}
 if(out.length>=3000){skipped.push('more than 3000 students');return}
 if(seen[sid]){skipped.push(sid+' appears twice');return}
 seen[sid]=1;out.push({sid,name})});out.skipped=skipped;return out}
const sheetRows=ws=>{const T=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,blankrows:false,defval:''}),V=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,blankrows:false,defval:''});
 return T.map((r,i)=>r.map((x,j)=>/^\d+(\.\d+)?e\+\d+$/i.test(String(x).trim())&&V[i]?String(V[i][j]):String(x).trim()))};
const rowsToLines=rows=>{const isId=h=>/\b(id|index|matric|reg|student no)\b|number/.test(h),isNm=h=>/name/.test(h);let hr=-1,ic=0,nc=[1],st0=0;
 for(let i=0;i<Math.min(rows.length,15);i++){const h=rows[i].map(x=>String(x).toLowerCase());if(h.some(isId)&&h.some(isNm)){hr=i;break}}
 if(hr>=0){const h=rows[hr].map(x=>String(x).toLowerCase());ic=h.findIndex(isId);nc=h.map((x,i)=>isNm(x)&&i!==ic?i:-1).filter(i=>i>=0).slice(0,3);st0=hr+1}
 else if(rows.length>1&&rows.slice(0,5).every((r,i)=>/^\d{1,4}\.?$/.test(r[0])&&+r[0]===+rows[0][0]+i)){ic=1;nc=[2]}
 return rows.slice(st0).map(r=>[r[ic],...nc.map(i=>r[i])].join('\t')).join('\n')};
const fileToText=async f=>{if(f.size>1e6)throw Error('File is too big. Use a file under 1 MB with just ID and name columns.');
 if(/\.(xlsx|xls)$/i.test(f.name)){if(!window.XLSX)throw Error('Excel library did not load. Check your internet connection.');
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array',sheetRows:3002});
  for(const n of wb.SheetNames){const rows=sheetRows(wb.Sheets[n]).filter(r=>r.some(x=>x!==''));if(rows.length)return rowsToLines(rows)}
  throw Error('The Excel file is empty')}
 return f.text()};

 out(){me=null;st={};editRt=false;if(live)sb.auth.signOut();go('welcome')},
 async mark(){if(st.busy)return;const code=$('#code').value.replace(/\D/g,'');if(code.length!==6)throw Error('Enter the 6-digit code');st.busy=1;try{const pos=await posNow();st.done=await api.mark(st.cls,st.sid,code,pos);go('done')}finally{st.busy=0}},
 async rsave(){const rows=parseRoster($('#rt').value),sk=rows.skipped;if(!rows.length)throw Error('No valid students found. '+(sk[0]?sk[0]+'. ':'')+'The file needs a Student ID column and a Name column.');
  const pv=await api.replaceRoster(rows,false),first=!(pv.kept+pv.removed);
  if(pv.removed>0&&!confirm('This REPLACES your class list with the '+rows.length+' students in the new file.\n\n'+pv.added+' new, '+pv.kept+' kept, '+pv.removed+' removed.\nRemoved students lose their account and attendance marks.\n\nContinue?')){note('Cancelled. Your class list was not changed.');return render()}
  const r=await api.replaceRoster(rows,true);editRt=false;note((first?'Class list saved: ':'Class list replaced: ')+rows.length+' students ('+r.added+' new, '+r.kept+' kept, '+r.removed+' removed). For example '+rows[0].sid+', '+rows[0].name+'.'+(sk.length?' '+sk.length+' row(s) skipped, e.g. '+sk.slice(0,3).join('; ')+'.':''),'ok');render()},
 async chkid(){const id=normId($('#tid').value);if(!id)throw Error('Type a student ID to check');const r=await api.lookup(me.cls,id);note(r?id+' is on the class list: '+r.name+'.':id+' is NOT on the class list. Check the spelling, or check the ID column in your Excel file.',r?'ok':'er');render()},
 async addc(){const names=[...new Set($('#cn').value.split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean))];if(!names.length)throw Error('Enter at least one course name');if(names.some(n=>n.length>80))throw Error('Course names must be 80 characters or less');if(names.length>20)throw Error('Add 20 courses at most at a time');
  await api.addCourses(names);note(names.length+(names.length>1?' courses added':' course added'),'ok');render()},
 async open(b){curWeek=+$('#wk').value;b.textContent='Getting your location…';const pos=await posNow();await api.open(b.dataset.id,curWeek,pos);msg='';render()},
 async clr(b){if(!confirm('Delete all attendance records for this course? Keep your downloaded Excel file safe.'))return;await api.clear(b.dataset.id);note('Course data cleared','ok');render()},
 async wipe(){if(prompt('Type CLEAR to delete ALL attendance records for every class')!=='CLEAR')return;await api.wipe();note('All attendance data cleared','ok');render()},
 async close(b){await api.close(b.dataset.id);render()},
 async xls(b){if(!window.XLSX)throw Error('Excel library did not load. Check your internet connection.');const sh=await api.sheet(b.dataset.id);
  const head=['ID','Name',...sh.weeks.map(w=>'W'+w),'Total'];
  const body=sh.rows.map(r=>[r.sid,r.name,...sh.weeks.map(w=>r.weeks.includes(w)?1:''),r.weeks.length]);
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([head,...body]),'Attendance');
  XLSX.writeFile(wb,(b.dataset.n||'course').replace(/[^\w-]+/g,'_')+'_attendance.xlsx',{compression:true});await api.exported(b.dataset.id);note('Register downloaded. You may now clear this course.','ok');render()}
};
$('#app').addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;try{await act[b.dataset.a](b)}catch(x){note(x.message,'er');render()}});
$('#app').addEventListener('input',async e=>{if(e.target.id!=='code')return;const v=e.target.value.replace(/\D/g,'');e.target.value=v;if(v.length===6){try{await act.mark()}catch(x){note(x.message,'er');render()}}});
$('#app').addEventListener('change',async e=>{if(e.target.id!=='rf'||!e.target.files[0])return;try{$('#rt').value=await fileToText(e.target.files[0]);await act.rsave()}catch(x){note(x.message,'er');render()}});
$('#adm').addEventListener('click',()=>{if(me&&me.role==='admin')return go('admin');me=null;st={};go('adminin')});
$('#adm').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.target.click()}});
if(window.self!==window.top){const e=$('#emb');e.hidden=false;e.textContent='This page is inside another page, which can block location. For attendance, ';const a=document.createElement('a');a.href=location.href;a.target='_blank';a.rel='noopener';a.textContent='open it in its own tab';e.appendChild(a);e.append('.')}
$('#mode').textContent=live?'':'Demo mode: data is kept in memory only. Demo ID: S001 (Regular, September, 2023, 100).';
setInterval(()=>document.querySelectorAll('[data-live]').forEach(async el=>{
 if(el.dataset.done)return;
 const finish=async why=>{el.dataset.done=1;el.textContent='······';let n='';try{n=' '+(await api.list({id:el.dataset.sid})).length+' student(s) marked for week '+el.dataset.wk+'.'}catch(e){}note((why||'The code has cleared.')+n+' To get a new code, open the course again.');render()};
 if(!+el.dataset.exp){if(el.dataset.busy)return;el.dataset.busy=1;
  try{const c=await api.liveCode(el.dataset.live);el.textContent=c.code;el.classList.add('flip');el.dataset.exp=Date.now()+c.left*1e3}catch(e){return finish('This code has already expired.')}
  el.dataset.busy=''}
 const left=+el.dataset.exp-Date.now();
 if(left<=0)return finish('The 50-second code has cleared.');
 el.style.setProperty('--p',Math.max(0,Math.min(1,left/5e4)));const cd=el.nextElementSibling;if(cd)cd.textContent='Code clears in '+Math.ceil(left/1e3)+'s'}),1000);
if(CFG.url&&CFG.key&&!window.supabase)showErr('Could not load the Supabase library, so the site is running in demo mode. Check the internet connection, or whether something is blocking cdn.jsdelivr.net.');
else if(live)sb.rpc('lookup_student',{p_class:'x',p_sid:'x'}).then(r=>{if(r.error)showErr('Cannot reach the database: '+r.error.message+'. If this mentions permission or not found, run schema-update.sql again.')},e=>showErr('Cannot reach the database: '+e.message));
render();
</script></body></html>
