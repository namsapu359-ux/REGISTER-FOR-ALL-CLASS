<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'unsafe-inline'; connect-src https://*.supabase.co; img-src data:; base-uri 'none'; form-action 'none'">
<title>Register Platform</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--tx:#14213d;--mut:#5b6785;--pri:#1d4ed8;--pt:#fff;--bd:#dbe1ee;--ok:#15803d;--er:#b91c1c;--g1:#dbe8ff;--g2:#f5f7fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#171f36;--tx:#e8ecf7;--mut:#9aa6c4;--pri:#5b8cff;--pt:#0b1020;--bd:#2a3556;--ok:#4ade80;--er:#f87171;--g1:#1b2a55;--g2:#0e1424}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#171f36;--tx:#e8ecf7;--mut:#9aa6c4;--pri:#5b8cff;--pt:#0b1020;--bd:#2a3556;--ok:#4ade80;--er:#f87171;--g1:#1b2a55;--g2:#0e1424}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px;min-height:100vh}
h2{font-size:18px;margin:0 0 10px}p.s{color:var(--mut);margin:0 0 12px;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
select,input,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:var(--pri);color:var(--pt);font:inherit;font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--pri);border:1px solid var(--bd)}button.sm{width:auto;padding:8px 14px;margin:8px 8px 0 0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{padding:10px 12px;border-radius:10px;margin-top:12px;font-size:14px;border:1px solid var(--bd)}.ok{color:var(--ok)}.er{color:var(--er)}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:2px 10px;font-size:12px;margin:2px 4px 2px 0}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px;border-bottom:1px solid var(--bd);text-align:left}
.course{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px;border:1px solid var(--bd);border-radius:12px;margin-top:10px;cursor:pointer;background:var(--bg)}
.pill{font-size:12px;padding:3px 10px;border-radius:20px;border:1px solid var(--bd);color:var(--mut)}.pill.on{color:var(--ok);border-color:var(--ok)}
.code{font-size:34px;letter-spacing:8px;text-align:center;font-weight:700;color:var(--pri);margin:8px 0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg button{margin-top:0}
.hero{min-height:88vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:18px;padding:24px;background:linear-gradient(160deg,var(--g1),var(--g2),var(--g1));background-size:200% 200%;animation:bg 8s ease infinite}
.hero .cap{font-size:64px;animation:pop .9s cubic-bezier(.2,1.6,.4,1) both}
.big{font-size:30px;line-height:1.2;margin:14px 0}.big span{display:inline-block;opacity:0;transform:translateY(16px);animation:rise .7s ease forwards}
.type{display:inline-block;overflow:hidden;white-space:nowrap;width:0;border-right:2px solid var(--pri);color:var(--mut);animation:type 1.6s steps(21) 1.9s forwards,caret .7s step-end 1.9s 6}
.later{opacity:0;animation:rise .8s ease 3.6s forwards;width:100%}
@keyframes rise{to{opacity:1;transform:none}}@keyframes pop{from{transform:scale(0) rotate(-30deg)}}@keyframes type{to{width:21ch}}@keyframes caret{50%{border-color:transparent}}@keyframes bg{50%{background-position:100% 100%}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style></head><body><main>
<p class="s" id="mode"></p>
<div id="app"></div>
</main>
<script>
const CFG={url:'https://veovcuveahclbkvtfzwc.supabase.co',key:'sb_publishable_gNffGLiAKkiv_bUSbAFsrg_ZKrf3lvw'};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const live=!!(CFG.url&&CFG.key&&window.supabase);
const sb=live?supabase.createClient(CFG.url,CFG.key):null;
const PROG=['Regular','Top-up','Access'],INTK=['September','January'],LV=[100,200,300,400];
const BATCH=Array.from({length:13},(_,i)=>2023+i);
const CL0='Regular|September|2023|100';
let D={roster:[{cls:CL0,sid:'S001',name:'Ama Mensah'},{cls:CL0,sid:'S002',name:'Kojo Boateng'}],users:[{id:'r1',email:'rep@demo.com',pw:'rep123',role:'rep',name:'Demo Rep',cls:CL0},{id:'a1',email:'admin@demo.com',pw:'admin123',role:'admin',name:'Demo Admin',cls:'ADMIN'}],courses:[{id:'c1',cls:CL0,name:'Basic Nursing'},{id:'c2',cls:CL0,name:'Medicine'}],sess:[],att:[],cred:{},exp:{}};
let curWeek=1,me=null,scr='welcome',msg='',st={},sel={program:'Regular',intake:'September',batch:2023,level:100};
const ck=c=>[c.program,c.intake,c.batch,c.level].join('|');
const mail=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'-')+'@students.example.com';
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const unb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const mkcode=()=>String(100000+crypto.getRandomValues(new Uint32Array(1))[0]%900000);
const dcode=(s,k)=>String(100000+Math.abs([...s+':'+k].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7))%900000);
const prof=async id=>{const r=await sb.from('profiles').select('*').eq('id',id).single();if(r.error)throw r.error;const p=r.data;return{id:p.id,name:p.full_name,role:p.role,cls:p.class_key,sid:p.student_id}};

const api={
 async lookup(cls,sid){
  if(!live){const r=D.roster.find(r=>r.cls===cls&&r.sid===sid);return r?{name:r.name,claimed:!!r.uid}:null}
  const r=await sb.rpc('lookup_student',{p_class:cls,p_sid:sid});if(r.error)throw r.error;const x=r.data&&r.data[0];return x?{name:x.full_name,claimed:x.claimed}:null},
 async signUp(cls,sid,pw){
  if(!live){const r=D.roster.find(r=>r.cls===cls&&r.sid===sid);if(!r)throw Error('Not on roster');if(r.uid)throw Error('Account exists. Please sign in.');const u={id:'u'+sid,sid,name:r.name,pw,cls,role:'student'};D.users.push(u);r.uid=u.id;return u}
  const {data,error}=await sb.auth.signUp({email:mail(sid),password:pw});if(error)throw error;
  if(!data.session)throw Error('Account created. Turn off "Confirm email" in Supabase Auth settings, then sign in.');
  const c=await sb.rpc('claim_profile',{p_class:cls,p_sid:sid});if(c.error)throw Error(c.error.message);return prof(data.user.id)},
 async signIn(id,pw,rep){
  if(!live){const u=D.users.find(u=>(rep?u.email===id&&u.role!=='student':u.sid===id)&&u.pw===pw);if(!u)throw Error('Wrong details');return u}
  const {data,error}=await sb.auth.signInWithPassword({email:rep?id:mail(id),password:pw});if(error)throw Error('Wrong details');return prof(data.user.id)},
 async courses(){
  if(!live)return D.courses.filter(c=>c.cls===me.cls).map(c=>({id:c.id,name:c.name,open:!!D.sess.find(s=>s.course===c.id&&s.closes>Date.now())}));
  const r=await sb.rpc('class_courses');if(r.error)throw r.error;return r.data.map(c=>({id:c.id,name:c.name,open:c.is_open}))},
 async addCourse(n){
  if(!live){D.courses.push({id:'c'+Date.now(),cls:me.cls,name:n});return}
  const r=await sb.from('courses').insert({class_key:me.cls,name:n});if(r.error)throw Error(r.error.message)},
 async rosterCount(){
  if(!live)return D.roster.filter(r=>r.cls===me.cls).length;
  const r=await sb.from('roster').select('*',{count:'exact',head:true}).eq('class_key',me.cls);return r.count||0},
 async upload(rows){
  if(!live){rows.forEach(x=>{const r=D.roster.find(r=>r.cls===me.cls&&r.sid===x.sid);r?r.name=x.name:D.roster.push({cls:me.cls,sid:x.sid,name:x.name})});return}
  const r=await sb.from('roster').upsert(rows.map(x=>({class_key:me.cls,student_id:x.sid,full_name:x.name})),{onConflict:'class_key,student_id'});if(r.error)throw Error(r.error.message)},
 async active(cid){
  if(!live){const s=D.sess.find(s=>s.course===cid&&s.closes>Date.now());return s||null}
  const r=await sb.from('sessions').select('id,closes_at,week').eq('course_id',cid).gt('closes_at',new Date().toISOString()).limit(1);
  const s=r.data&&r.data[0];return s?{id:s.id,week:s.week,closes:Date.parse(s.closes_at)}:null},
 async close(cid){
  if(!live){D.sess.forEach(s=>{if(s.course===cid)s.closes=0});return}
  await sb.from('sessions').update({closes_at:new Date().toISOString()}).eq('course_id',cid).gt('closes_at',new Date().toISOString())},
 async open(cid,mins,week){
  await this.close(cid);const secret=mkcode()+Math.random(),closes=Date.now()+mins*6e4;
  if(!live){const o=D.sess.find(s=>s.course===cid&&s.week===week);if(o){o.closes=closes}else D.sess.push({id:'s'+Date.now(),course:cid,cls:me.cls,week,secret,closes});return}
  const row={closes_at:new Date(closes).toISOString()};
  const ex=await sb.from('sessions').select('id').eq('course_id',cid).eq('week',week).limit(1);
  const r=ex.data&&ex.data[0]?await sb.from('sessions').update(row).eq('id',ex.data[0].id):await sb.from('sessions').insert({...row,course_id:cid,class_key:me.cls,week});
  if(r.error)throw Error(r.error.message)},
 async sheet(cid){
  if(!live){const ss=D.sess.filter(s=>s.course===cid),rows=D.roster.filter(r=>r.cls===me.cls).map(r=>{const u=D.users.find(x=>x.sid===r.sid&&x.cls===r.cls);return{sid:r.sid,name:r.name,weeks:ss.filter(s=>u&&D.att.find(a=>a.s===s.id&&a.u===u.id)).map(s=>s.week)}});return{weeks:[...new Set(ss.map(s=>s.week))].sort((a,b)=>a-b),rows}}
  const w=await sb.from('sessions').select('week').eq('course_id',cid);let rows=[];
  for(let i=0;;i+=1000){const r=await sb.rpc('course_matrix',{p_course:cid}).range(i,i+999);if(r.error)throw Error(r.error.message);rows=rows.concat(r.data.map(x=>({sid:x.student_id,name:x.full_name,weeks:x.weeks||[]})));if(r.data.length<1000)break}
  return{weeks:[...new Set((w.data||[]).map(x=>x.week))].sort((a,b)=>a-b),rows}},
 async getCred(){
  if(!live)return D.cred[me.id]||null;
  const r=await sb.from('credentials').select('cred_id').eq('user_id',me.id).maybeSingle();return r.data?r.data.cred_id:null},
 async saveCred(id,pk){
  if(!live){D.cred[me.id]=id;return}
  const r=await sb.from('credentials').insert({user_id:me.id,cred_id:id,public_key:pk});if(r.error)throw r.error},
 async mark(cid,code){
  if(!live){const sl=Math.floor(Date.now()/15e3),s=D.sess.find(s=>s.course===cid&&s.closes>Date.now()&&[sl,sl-1].some(k=>dcode(s.secret,k)===code));if(!s)throw Error('Wrong or expired code');if(!D.att.find(a=>a.s===s.id&&a.u===me.id))D.att.push({s:s.id,u:me.id,t:Date.now()});return}
  const r=await sb.rpc('mark_attendance',{p_course:cid,p_code:code});if(r.error)throw Error(r.error.message);if(r.data!=='ok')throw Error(r.data)},
 async list(s){
  if(!live)return D.att.filter(a=>a.s===s.id).map(a=>{const u=D.users.find(x=>x.id===a.u);return{name:u.name,sid:u.sid,t:a.t}});
  const r=await sb.from('attendance').select('marked_at,profiles(full_name,student_id)').eq('session_id',s.id);
  return (r.data||[]).map(a=>({name:a.profiles.full_name,sid:a.profiles.student_id,t:Date.parse(a.marked_at)}))},
 async liveCode(cid){
  const sl=Math.floor(Date.now()/15e3),left=15-Math.floor(Date.now()/1e3)%15;
  if(!live){const s=D.sess.find(s=>s.course===cid&&s.closes>Date.now());if(!s)throw Error('No open session');return{code:dcode(s.secret,sl),left}}
  const r=await sb.rpc('session_code',{p_course:cid});if(r.error)throw r.error;return{code:r.data[0].code,left:r.data[0].secs}},
 async exported(cid){if(!live){D.exp[cid]=1;return}const r=await sb.rpc('mark_exported',{p_course:cid});if(r.error)throw Error(r.error.message)},
 async clear(cid){
  if(!live){if(!D.exp[cid])throw Error('Download the Excel register first');D.sess=D.sess.filter(s=>s.course!==cid);return}
  const r=await sb.rpc('clear_course',{p_course:cid});if(r.error)throw Error(r.error.message)},
 async stats(){if(!live)return{mb:0,rows:D.att.length};const r=await sb.rpc('admin_stats');if(r.error)throw Error(r.error.message);return r.data},
 async wipe(){if(!live){D.sess=[];D.att=[];return}const r=await sb.rpc('admin_clear_all');if(r.error)throw Error(r.error.message)}
};

async function enroll(){
 const id=await api.getCred();if(id)return id;
 const c=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:'Register Platform'},user:{id:new TextEncoder().encode(me.id),name:me.sid,displayName:me.name},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});
 const cid=b64(c.rawId);await api.saveCred(cid,b64(c.response.getPublicKey?c.response.getPublicKey():new ArrayBuffer(0)));return cid}
async function verify(cid){await navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:'public-key',id:unb(cid),transports:['internal']}],userVerification:'required',timeout:60000}})}
function parseRoster(t){const out=[],seen={};t.split(/\r?\n/).forEach((l,i)=>{const p=l.split(/[,\t;]/).map(x=>x.trim().replace(/^"|"$/g,''));const sid=p[0],name=p.slice(1).join(' ').trim();if(!/^[A-Za-z0-9._-]{1,20}$/.test(sid)||!name||name.length>100||out.length>=3000)return;if(i===0&&/id/i.test(sid)&&/name/i.test(name))return;if(!seen[sid]){seen[sid]=1;out.push({sid,name})}});return out}

const opt=(arr,v)=>arr.map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join('');
const tags=c=>c.split('|').map(x=>`<span class="tag">${esc(x)}</span>`).join('');
const note=(t,c)=>msg=`<div class="msg ${c||''}">${esc(t)}</div>`;
const go=(s)=>{scr=s;msg='';render()};
const back=(t,a)=>`<button class="g" data-a="${a}">${t}</button>`;
const hhmm=t=>new Date(t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});

async function render(){
 const a=$('#app');
 if(scr==='welcome'){a.innerHTML=`<div class="hero"><div class="cap">🎓</div><h1 class="big">${'Welcome to the Register Platform'.split(' ').map((w,i)=>`<span style="animation-delay:${.5+i*.3}s">${w}</span>`).join(' ')}</h1><div class="type">Sign in to your class</div><div class="later"><button data-a="start">Sign in to your class</button><button class="g" data-a="rep">I am a course rep</button></div></div>`;return}
 if(scr==='class'){a.innerHTML=`<div class="card"><h2>Sign in to your class</h2><div class="row">
 <div><label>Program</label><select id="program">${opt(PROG,sel.program)}</select></div><div><label>Intake</label><select id="intake">${opt(INTK,sel.intake)}</select></div>
 <div><label>Batch (year)</label><select id="batch">${opt(BATCH,sel.batch)}</select></div><div><label>Level</label><select id="level">${opt(LV,sel.level)}</select></div></div>
 <label>Student ID</label><input id="sid" autocomplete="off" autocapitalize="characters" value="${esc(st.sid||'')}">
 <button data-a="find">Find me</button>${back('Back','welcome')}${msg}</div>`;return}
 if(scr==='auth'){const up=st.tab==='up';a.innerHTML=`<div class="card"><h2>Hello, ${esc(st.name)} 👋</h2><div>${tags(st.cls)}</div>
 <div class="seg" style="margin-top:12px"><button class="${up?'g':''}" data-a="tab" data-v="in">Sign in</button><button class="${up?'':'g'}" data-a="tab" data-v="up">Create account</button></div>
 <label>${up?'Create a password (8+ characters)':'Password'}</label><input id="pw" type="password" autocomplete="${up?'new-password':'current-password'}">
 ${up?'<label>Confirm password</label><input id="pw2" type="password" autocomplete="new-password">':''}
 <button data-a="auth">${up?'Create account':'Sign in'}</button>${back('Not you?','class')}${msg}</div>`;return}
 if(scr==='home'){const cs=await api.courses();a.innerHTML=`<div class="card"><h2>${esc(me.name)}</h2><div>${tags(me.cls)}</div><p class="s" style="margin-top:10px">Tap your course. Your course rep must have accepted it first.</p>
 ${cs.map(c=>`<div class="course" data-a="pick" data-id="${esc(c.id)}" data-n="${esc(c.name)}" data-o="${c.open?1:0}"><b>${esc(c.name)}</b><span class="pill ${c.open?'on':''}">${c.open?'Open':'Waiting'}</span></div>`).join('')||'<p class="s">Your course rep has not added courses yet.</p>'}
 <button class="g" data-a="home">Refresh</button>${back('Sign out','out')}${msg}</div>`;return}
 if(scr==='mark'){a.innerHTML=`<div class="card"><h2>${esc(st.cn)}</h2><p class="s">Enter the code on your course rep's screen (it changes every 15 seconds), then confirm with your fingerprint or face.</p>
 <input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6-digit code" style="font-size:24px;text-align:center;letter-spacing:6px">
 <button data-a="mark">👆 Mark my attendance</button>${back('Back','home')}${msg}</div>`;return}
 if(scr==='rep'){a.innerHTML=`<div class="card"><h2>Course rep sign in</h2><label>Email</label><input id="em" type="email"><label>Password</label><input id="pw" type="password">
 <button data-a="repin">Sign in</button>${live?'':'<p class="s">Demo: rep@demo.com / rep123</p>'}${back('Back','welcome')}${msg}</div>`;return}
 if(scr==='repHome'){const cs=await api.courses(),n=await api.rosterCount();let h='';
  for(const c of cs){const s=await api.active(c.id);h+=`<div class="card" style="background:var(--bg)"><b>${esc(c.name)}</b>`;
   const dl=`<button class="sm g" data-a="xls" data-id="${esc(c.id)}" data-n="${esc(c.name)}">Download Excel</button><button class="sm g" data-a="clr" data-id="${esc(c.id)}">Clear semester data</button>`;
   if(s){const rows=await api.list(s);h+=`<div class="code" data-live="${esc(c.id)}" data-exp="0">······</div><p class="s" style="text-align:center"></p><p class="s" style="text-align:center">Week ${esc(s.week)} open until ${hhmm(s.closes)}. ${rows.length} marked.</p><div class="tw"><table>${rows.slice(-8).reverse().map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.sid)}</td><td>${hhmm(r.t)}</td></tr>`).join('')}</table></div><button class="sm" data-a="repHome">Refresh</button>${dl}<button class="sm g" data-a="close" data-id="${esc(c.id)}">Close</button>`}
   else h+=`<br><button class="sm" data-a="open" data-id="${esc(c.id)}">Accept &amp; open</button>${dl}`;h+='</div>'}
  a.innerHTML=`<div class="card"><h2>Class</h2><div>${tags(me.cls)}</div></div>
  <div class="card"><h2>Members (${n})</h2><p class="s">One per line: StudentID, Full name</p><textarea id="rt" rows="5" placeholder="S001, Ama Mensah&#10;S002, Kojo Boateng"></textarea><input id="rf" type="file" accept=".csv,.txt" style="margin-top:8px"><button data-a="rsave">Save members</button></div>
  <div class="card"><h2>Courses</h2><input id="cn" placeholder="e.g. Basic Nursing"><button data-a="addc">Add course</button><div class="row"><div><label>Week</label><select id="wk">${opt(Array.from({length:20},(_,i)=>i+1),curWeek)}</select></div><div><label>Open for</label><select id="mn"><option value="10">10 minutes</option><option value="20">20 minutes</option><option value="60">1 hour</option></select></div></div></div>${h}${msg}${back('Sign out','out')}`}
 if(scr==='admin'){const x=await api.stats();a.innerHTML=`<div class="card"><h2>Super admin</h2><p class="s">Database: ${esc(x.mb)} MB of 500 MB. Attendance records: ${esc(x.rows)}.</p><button data-a="wipe">Clear ALL attendance data</button>${msg}${back('Sign out','out')}</div>`}
}

const act={
 welcome:()=>go('welcome'),start:()=>go('class'),rep:()=>go('rep'),class:()=>go('class'),home:()=>go('home'),repHome:()=>render(),
 async find(){sel={program:$('#program').value,intake:$('#intake').value,batch:$('#batch').value,level:$('#level').value};const sid=$('#sid').value.trim();st.sid=sid;if(!sid)throw Error('Enter your student ID');
  const r=await api.lookup(ck(sel),sid);if(!r)throw Error('ID not found in this class. Check your selections or ask your course rep.');st={sid,cls:ck(sel),name:r.name,tab:r.claimed?'in':'up'};go('auth')},
 tab(b){st.tab=b.dataset.v;msg='';render()},
 async auth(){const pw=$('#pw').value;if(st.tab==='up'){if(pw.length<8)throw Error('Password needs 8+ characters');if(pw!==$('#pw2').value)throw Error('Passwords do not match');me=await api.signUp(st.cls,st.sid,pw)}else me=await api.signIn(st.sid,pw);go('home')},
 async repin(){const u=await api.signIn($('#em').value.trim(),$('#pw').value,true);if(u.role==='admin'){me=u;return go('admin')}if(u.role!=='rep')throw Error('Not a course rep account');me=u;go('repHome')},
 out(){me=null;st={};go('welcome')},
 pick(b){if(b.dataset.o!=='1'){note('Not open yet. Ask your course rep to accept this course.','er');return render()}st.cid=b.dataset.id;st.cn=b.dataset.n;go('mark')},
 async mark(){const code=$('#code').value.trim();if(!/^\d{6}$/.test(code))throw Error('Enter the 6-digit code');const cid=await enroll();await verify(cid);await api.mark(st.cid,code);note('Attendance marked ✓ for '+st.cn,'ok');render()},
 async rsave(){const rows=parseRoster($('#rt').value);if(!rows.length)throw Error('No valid lines found. Use: StudentID, Full name');await api.upload(rows);note(rows.length+' members saved','ok');render()},
 async addc(){const n=$('#cn').value.trim();if(!n)throw Error('Enter a course name');await api.addCourse(n);msg='';render()},
 async open(b){curWeek=+$('#wk').value;await api.open(b.dataset.id,+$('#mn').value,curWeek);msg='';render()},
 async clr(b){if(!confirm('Delete all attendance records for this course? Keep your downloaded Excel file safe.'))return;await api.clear(b.dataset.id);note('Course data cleared','ok');render()},
 async wipe(){if(prompt('Type CLEAR to delete ALL attendance records for every class')!=='CLEAR')return;await api.wipe();note('All attendance data cleared','ok');render()},
 async close(b){await api.close(b.dataset.id);render()},
 async xls(b){if(!window.XLSX)throw Error('Excel library did not load. Check your internet connection.');const sh=await api.sheet(b.dataset.id);
  const head=['Student ID','Name',...sh.weeks.map(w=>'Week '+w),'Total'];
  const body=sh.rows.map(r=>[r.sid,r.name,...sh.weeks.map(w=>r.weeks.includes(w)?'P':''),r.weeks.length]);
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([head,...body]),'Attendance');
  XLSX.writeFile(wb,(b.dataset.n||'course').replace(/[^\w-]+/g,'_')+'_attendance.xlsx');await api.exported(b.dataset.id);note('Register downloaded. You may now clear this course.','ok');render()}
};

 const cd=el.nextElementSibling;if(cd)cd.textContent='New code in '+Math.max(0,Math.ceil((+el.dataset.exp-Date.now())/1e3))+'s'}),1000);
